name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# packages: read — @mister-guiiug/dev-pwa-config vient de GitHub Packages
# (même motif que le setup-pwa du socle : registry-url + scope sur setup-node,
# NODE_AUTH_TOKEN sur npm ci).
permissions:
  contents: read
  packages: read

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # `.nvmrc` FAIT FOI, ET IL N'EST PLUS RECOPIÉ ICI. La matrice éprouvait
          # 20.x et 22.x quand le dépôt développait sur 26.2.0 depuis #22 : la CI
          # validait deux versions que personne ne faisait tourner, et aucune de
          # celle qu'on utilise. Recopier un numéro, c'est le laisser diverger ;
          # le lire rend l'écart impossible.
          #
          # UNE SEULE VERSION SUFFIT, contrairement au socle. Celui-ci publie
          # `engines: >=22` et doit donc éprouver sa promesse en plus de son
          # épingle. Ce dépôt-ci est `private`, sans `engines`, et embarque son
          # propre Node dans Electron : il n'a aucun consommateur à qui promettre
          # une compatibilité plus large, donc rien à éprouver hors de `.nvmrc`.
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mister-guiiug'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  package:
    name: package desktop
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mister-guiiug'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build:electron
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: release/

  # LE SEUL CONTEXTE QUE LA PROTECTION DE BRANCHE EXIGE.
  #
  # Un job matriciel ne rapporte pas son `name:` : il en rapporte un PAR entrée,
  # suffixé de la valeur de matrice. La protection de branche a longtemps exigé
  # `typecheck · test · build (20.x)` et `(22.x)` nommément — donc un numéro de
  # version DANS une protection de branche, qui gèle toutes les PR le jour où la
  # matrice bouge, le contexte attendu n'arrivant alors jamais. C'est arrivé sur
  # dev-pwa-config les 10–13/09/2026 : trois jours de PR BLOCKED, franchies au
  # seul contournement admin.
  #
  # CE JOB EST CE QUI A RENDU L'ALIGNEMENT POSSIBLE. `build` a perdu sa matrice
  # juste après, pour suivre `.nvmrc` : ses deux anciens contextes ont disparu
  # d'un coup, et personne n'a eu à toucher à une protection de branche. C'est
  # exactement le service que ce job rend, et il le rendra encore au prochain
  # relèvement — il n'a ni matrice ni version dans son nom.
  #
  # `package desktop` est délibérément HORS du `needs:` — il ne s'exécute que
  # sur un tag `v*`, donc il est toujours sauté en PR et n'a rien à y attester.
  # Tout autre job ajouté à ce fichier doit en revanche y entrer, sans quoi il
  # serait vert pour GitHub sans que personne le regarde.
  tout-vert:
    name: Toute la CI est verte
    needs: build
    # SANS `always()`, UN `build` ROUGE FAIT SAUTER CE JOB — et GitHub compte un
    # job sauté comme un check RÉUSSI. Le portail laisserait passer très
    # exactement ce qu'il existe pour retenir.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Résultat de chaque job requis
        env:
          RESULTATS: ${{ toJSON(needs) }}
        run: echo "$RESULTATS"

      - name: Un seul job non vert suffit à faire rougir ce portail
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::Un job requis n'est pas vert — voir les résultats ci-dessus."
          exit 1
